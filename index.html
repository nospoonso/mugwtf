<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUG: What The Face?!</title>
    <meta name="author" content="NoSpoon Inc.">
    
    <!-- Link to your favicon image file -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Lock viewport scrolling completely */
        }

        .wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .cover-image {
            display: block;
            object-fit: contain;
            width: 100%;
            max-width: 1200px;
            height: auto;
            max-height: 90vh;
        }

        /* 📱 TARGETED MOBILE BREAKPOINT OVERRIDE */
        @media (max-width: 768px) {
            .wrapper {
                padding: 0; /* Remove gaps */
            }
            
            .cover-image {
                width: auto;
                height: auto;
                max-width: none;
                max-height: none;
                /* Zoom asset manually to fill narrow aspect ratios cleanly */
                transform: scale(2.2); 
                transform-origin: center center;
            }
        }

        /* 📱 Adjust scaling fallback for extra narrow phones */
        @media (max-width: 400px) {
            .cover-image {
                transform: scale(2.5);
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <img src="Web.png" alt="MUG: What The Face?!" class="cover-image">
    </div>

</body>
</html>
