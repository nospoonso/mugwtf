<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUG: What The Face?!</title>
    <meta name="author" content="NoSpoon Inc.">
    
    <!-- Link to your favicon image file -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Container that scales perfectly to fit screens while keeping proportions */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            max-width: 1000px; /* Fits desktop layouts smoothly */
            margin: auto;
        }

        /* The cover image asset */
        .cover-image {
            width: 100%;
            height: auto;
            max-height: 80vh; /* Prevents overflow clipping on tall phone displays */
            object-fit: contain;
            display: block;
        }

        /* Legal Footer styled perfectly underneath your layout design */
        footer {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 14px;
            color: #262626; /* Dark gray to match your hidden mockup footer look */
            letter-spacing: 0.5px;
            text-align: center;
            width: 100%;
            padding-top: 20px;
        }

        /* Responsive optimization for tiny mobile layouts */
        @media (max-width: 480px) {
            footer {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Renders your exact high-resolution visual layout asset centered -->
        <img src="Web.png" alt="MUG: What The Face?! App Loading" class="cover-image">
    </div>

    <!-- Compliant Corporate Ownership Footer -->
    <footer>
        &copy; 2026 NoSpoon Inc. All Rights Reserved.
    </footer>

</body>
</html>
