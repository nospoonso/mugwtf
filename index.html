<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MUG: What The Face?!</title>
    <meta name="author" content="NoSpoon Inc.">
    
    <!-- Link to your favicon image file -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Prevent extra screen scrolling */
        }

        .wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px; /* Slight screen clearance padding */
        }

        .cover-image {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Natively stretches the asset without zooming */
        }

        /* 📱 Clean Mobile Override Rules */
        @media (max-width: 768px) {
            .wrapper {
                padding: 8px;
            }
            .cover-image {
                width: 100vw;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <img src="Web.png" alt="MUG: What The Face?!" class="cover-image">
    </div>

</body>
</html>
