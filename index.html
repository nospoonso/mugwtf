<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUG: What The Face?!</title>
    <meta name="author" content="NoSpoon Inc.">
    
    <!-- Link to your favicon image file -->
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Container that scales perfectly to fit screens while keeping proportions */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1000px; /* Fits desktop layouts smoothly */
            margin: auto;
        }

        /* The cover image asset */
        .cover-image {
            width: 100%;
            height: auto;
            max-height: 90vh; /* Scaled larger now that footer text is removed */
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Renders your exact high-resolution visual layout asset centered -->
        <img src="Web.png" alt="MUG: What The Face?!" class="cover-image">
    </div>

</body>
</html>
